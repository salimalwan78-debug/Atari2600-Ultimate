name: PR Test Suite (no APK)

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional open pull request number (leave empty to test the selected branch)"
        required: false
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-tests-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/run-tests' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve pull request head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const requested = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs?.pr_number
              : String(context.issue.number);
            if (requested) {
              const number = Number(requested);
              if (!Number.isInteger(number) || number < 1) {
                core.setFailed('A valid pull request number is required.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number
              });
              if (pr.state !== 'open') {
                core.setFailed('Only open pull requests can be tested. For merged code, run this workflow manually without a PR number.');
                return;
              }
              core.setOutput('number', String(number));
              core.setOutput('repo', pr.head.repo.full_name);
              core.setOutput('sha', pr.head.sha);
              core.info(`Testing PR #${number} at ${pr.head.sha} from ${pr.head.repo.full_name}`);
            } else {
              core.setOutput('number', 'branch');
              core.setOutput('repo', context.repo.owner + '/' + context.repo.repo);
              core.setOutput('sha', context.sha);
              core.info(`Testing selected branch at ${context.sha}`);
            }

      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - name: Download EmulatorJS assets required by Flutter analysis
        run: |
          set -euo pipefail
          BASE="https://cdn.emulatorjs.org/stable/data"
          DATA_DIR="assets/emulatorjs/data"
          CORE_DIR="$DATA_DIR/cores"
          SRC_DIR="$DATA_DIR/src"
          LOCALE_DIR="$DATA_DIR/localization"
          COMPRESSION_DIR="$DATA_DIR/compression"
          mkdir -p "$CORE_DIR" "$SRC_DIR" "$LOCALE_DIR" "$COMPRESSION_DIR"
          for file in loader.js emulator.min.js emulator.min.css emulator.css version.json; do
            curl --retry 3 --retry-all-errors -fL "$BASE/$file" -o "$DATA_DIR/$file"
            test -s "$DATA_DIR/$file"
          done
          for file in extract7z.js extractzip.js libunrar.js libunrar.wasm; do
            curl --retry 3 --retry-all-errors -fL "$BASE/compression/$file" -o "$COMPRESSION_DIR/$file"
            test -s "$COMPRESSION_DIR/$file"
          done
          for file in GameManager.js compression.js emulator.js gamepad.js nipplejs.js shaders.js socket.io.min.js storage.js; do
            curl --retry 3 --retry-all-errors -fL "$BASE/src/$file" -o "$SRC_DIR/$file"
            test -s "$SRC_DIR/$file"
          done
          curl --retry 3 --retry-all-errors -fL "$BASE/localization/ar-AR.json" -o "$LOCALE_DIR/ar-AR.json"
          curl --retry 3 --retry-all-errors -fL "$BASE/cores/cores.json" -o "$CORE_DIR/cores.json"
          test -s "$LOCALE_DIR/ar-AR.json"
          test -s "$CORE_DIR/cores.json"
          for core in stella2014 fceumm gambatte mgba genesis_plus_gx; do
            for variant in "" "-legacy"; do
              file="${core}${variant}-wasm.data"
              curl --retry 3 --retry-all-errors -fL "$BASE/cores/$file" -o "$CORE_DIR/$file"
              test -s "$CORE_DIR/$file"
            done
          done

      - name: Validate project contracts
        run: python3 scripts/validate_project.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("assets/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline application JavaScript found")
          Path("/tmp/app-inline.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/app-inline.js

      - name: Report tested revision
        run: |
          echo "Target: ${{ steps.pr.outputs.number }}"
          echo "Commit: ${{ steps.pr.outputs.sha }}"
          echo "Test suite completed without building an APK."
