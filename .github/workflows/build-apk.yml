name: Build Atari 2600 APK
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Public app version (V0, V1, V2...)"
        required: true
        default: "V0"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ github.event.inputs.app_version || 'V0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true
      - name: Validate requested app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_VERSION" =~ ^V([0-9]+)$ ]] || { echo "Use V0, V1, V2..." >&2; exit 1; }
          INDEX="${BASH_REMATCH[1]}"
          BUILD_NUMBER=$((INDEX + 5))
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $APP_VERSION with Android versionCode $BUILD_NUMBER"
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.atari2600ultimate .
      - name: Enforce Android V2 embedding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")

          app = Path("android/app/src/main")
          package = "com.atari2600ultimate.atari2600_ultimate"
          activity_dir = app / "kotlin" / Path(package.replace(".", "/"))
          activity_dir.mkdir(parents=True, exist_ok=True)
          activity = activity_dir / "MainActivity.kt"
          activity.write_text(
              f"package {package}\n\n"
              "import io.flutter.embedding.android.FlutterActivity\n\n"
              "class MainActivity : FlutterActivity()\n"
          )

          manifest = app / "AndroidManifest.xml"
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app_node = root.find("application")
          if app_node is None:
              raise SystemExit("Generated Android manifest has no <application>")
          app_node.attrib.pop(android + "name", None) if app_node.get(android + "name") == "io.flutter.app.FlutterApplication" else None
          for activity_node in app_node.findall("activity"):
              name = activity_node.get(android + "name", "")
              if name.endswith("MainActivity") or name == "io.flutter.app.FlutterActivity":
                  activity_node.set(android + "name", ".MainActivity")
          main_activity = next((a for a in app_node.findall("activity") if a.get(android + "name") == ".MainActivity"), None)
          if main_activity is None:
              raise SystemExit("Generated manifest has no launcher MainActivity")
          # Flutter requires this V2 marker directly under <application>.
          # Placing it inside <activity> is ignored by Flutter's migration check.
          for activity_node in app_node.findall("activity"):
              for meta in list(activity_node.findall("meta-data")):
                  if meta.get(android + "name") == "flutterEmbedding":
                      activity_node.remove(meta)
          embedding_meta = next(
              (m for m in app_node.findall("meta-data")
               if m.get(android + "name") == "flutterEmbedding"),
              None,
          )
          if embedding_meta is None:
              embedding_meta = ET.SubElement(app_node, "meta-data")
              embedding_meta.set(android + "name", "flutterEmbedding")
          embedding_meta.set(android + "value", "2")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          verified = ET.parse(manifest).getroot()
          verified_app = verified.find("application")
          if verified_app is None or not any(
              m.get(android + "name") == "flutterEmbedding"
              and m.get(android + "value") == "2"
              for m in verified_app.findall("meta-data")
          ):
              raise SystemExit("Flutter V2 embedding marker is missing from <application>")

          legacy_tokens = (
              "io.flutter.app.FlutterActivity",
              "io.flutter.app.FlutterApplication",
              "io.flutter.view.FlutterView",
              "PluginRegistry.Registrar",
          )
          offenders = []
          for path in Path("android").rglob("*"):
              if path.is_file() and path.suffix in (".kt", ".java", ".xml"):
                  try:
                      content = path.read_text(errors="ignore")
                  except OSError:
                      continue
                  for token in legacy_tokens:
                      if token in content:
                          offenders.append(f"{path}: {token}")
          if offenders:
              raise SystemExit("Legacy Android embedding references found:\n" + "\n".join(offenders))
          print("Android V2 embedding verified; legacy embedding references absent.")
          PY
      - name: Allow loopback-only local WebView asset server
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="false">127.0.0.1</domain>
                  <domain includeSubdomains="false">localhost</domain>
              </domain-config>
          </network-security-config>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          application.set(android + "networkSecurityConfig", "@xml/network_security_config")
          # The embedded loopback HTTP server needs INTERNET permission even
          # though it never opens a remote connection for emulator assets.
          permission_name = "android.permission.INTERNET"
          if not any(item.get(android + "name") == permission_name for item in root.findall("uses-permission")):
              permission = ET.Element("uses-permission")
              permission.set(android + "name", permission_name)
              root.insert(0, permission)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          # Fail early if either setting is missing or attached to the wrong node.
          check = ET.parse(path).getroot()
          app = check.find("application")
          has_internet = any(item.get(android + "name") == permission_name for item in check.findall("uses-permission"))
          if app is None or app.get(android + "networkSecurityConfig") != "@xml/network_security_config" or not has_internet:
              raise SystemExit("Loopback server manifest configuration is incomplete")
          print("Configured loopback-only cleartext access and INTERNET permission for the embedded asset server.")
          PY
      - name: Configure stable Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/atari-release.jks
          test -s android/app/atari-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=atari-release.jks
          EOF
          python3 scripts/configure_android_signing.py
      - name: Download stable offline EmulatorJS runtime and core data
        run: |
          set -euo pipefail
          BASE="https://cdn.emulatorjs.org/stable/data"
          DATA_DIR="assets/emulatorjs/data"
          CORE_DIR="$DATA_DIR/cores"
          SRC_DIR="$DATA_DIR/src"
          LOCALE_DIR="$DATA_DIR/localization"
          COMPRESSION_DIR="$DATA_DIR/compression"
          mkdir -p "$CORE_DIR" "$SRC_DIR" "$LOCALE_DIR" "$COMPRESSION_DIR"
          curl --retry 3 --retry-all-errors -fL "$BASE/loader.js" -o "$DATA_DIR/loader.js"
          curl --retry 3 --retry-all-errors -fL "$BASE/emulator.min.js" -o "$DATA_DIR/emulator.min.js"
          curl --retry 3 --retry-all-errors -fL "$BASE/emulator.min.css" -o "$DATA_DIR/emulator.min.css"
          curl --retry 3 --retry-all-errors -fL "$BASE/emulator.css" -o "$DATA_DIR/emulator.css"
          curl --retry 3 --retry-all-errors -fL "$BASE/version.json" -o "$DATA_DIR/version.json"
          # Bundle every official compression helper and its WebAssembly dependency.
          for file in extract7z.js extractzip.js libunrar.js libunrar.wasm; do
            curl --retry 3 --retry-all-errors -fL "$BASE/compression/$file" -o "$COMPRESSION_DIR/$file"
            test -s "$COMPRESSION_DIR/$file"
          done
          # The stable loader/runtime also requests these support scripts from data/src/.
          for file in GameManager.js compression.js emulator.js gamepad.js nipplejs.js shaders.js socket.io.min.js storage.js; do
            curl --retry 3 --retry-all-errors -fL "$BASE/src/$file" -o "$SRC_DIR/$file"
            test -s "$SRC_DIR/$file"
          done
          # The app UI is Arabic; bundle its locale so the runtime never reaches the network.
          curl --retry 3 --retry-all-errors -fL "$BASE/localization/ar-AR.json" -o "$LOCALE_DIR/ar-AR.json"
          # EmulatorJS resolves Atari 2600 to Stella 2014 and NES to FCEUmm.
          # Keep both normal and legacy single-thread data packs available offline.
          for core in stella2014 fceumm; do
            for variant in "" "-legacy"; do
              file="${core}${variant}-wasm.data"
              curl --retry 3 --retry-all-errors -fL "$BASE/cores/$file" -o "$CORE_DIR/$file"
              test -s "$CORE_DIR/$file"
            done
          done
          for file in loader.js emulator.min.js emulator.min.css emulator.css version.json; do test -s "$DATA_DIR/$file"; done
          echo "Verified EmulatorJS runtime, support scripts, Arabic localization and Atari/NES core packs."
          find "$DATA_DIR" -type f -printf '%P %s bytes\\n' | sort
      - name: Set app version
        run: |
          sed -i "s/const APP_VERSION = '[^']*';/const APP_VERSION = '${APP_VERSION}';/" assets/index.html
      - name: Install dependencies
        run: flutter pub get
      - name: Validate project contracts
        run: python3 scripts/validate_project.py
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("assets/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          Path("/tmp/app-inline.js").write_text("\\n".join(scripts))
          if not scripts:
              raise SystemExit("No inline application JavaScript found")
          PY
          node --check /tmp/app-inline.js
      - name: Build signed release APK
        run: flutter build apk --release --build-name=0.0.0 --build-number=${{ steps.version.outputs.build_number }}
      - name: Verify APK contains offline emulator payload
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/loader.js' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/emulator.min.js' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/emulator.min.css' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/emulator.css' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/version.json' /tmp/apk-files.txt
          for file in extract7z.js extractzip.js libunrar.js libunrar.wasm; do
            grep -q "assets/flutter_assets/assets/emulatorjs/data/compression/$file" /tmp/apk-files.txt
          done
          for file in GameManager.js compression.js emulator.js gamepad.js nipplejs.js shaders.js socket.io.min.js storage.js; do
            grep -q "assets/flutter_assets/assets/emulatorjs/data/src/$file" /tmp/apk-files.txt
          done
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/localization/ar-AR.json' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/index.html' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/cores/stella2014-wasm.data' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/cores/stella2014-legacy-wasm.data' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/cores/fceumm-wasm.data' /tmp/apk-files.txt
          grep -q 'assets/flutter_assets/assets/emulatorjs/data/cores/fceumm-legacy-wasm.data' /tmp/apk-files.txt
          echo "APK contains index, loader, runtime, support scripts, Arabic locale and all selected core data variants."
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atari2600-Ultimate-${{ github.event.inputs.app_version || 'V0' }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
